<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tarjeta de Perfil en Vivo</title>
        <link rel="stylesheet" href="./css/estilos.css">
    </head>
    <body>
        <main class="layout">
            <section class="panel form-panel" aria-label="Formulario de perfil">
                <h1 class="panel-title">✨ Perfil en Vivo</h1>
                <p class="panel-subtitle">Completa los campos para actualizar la tarjeta al instante.</p>

                <form id="perfilForm" class="profile-form" novalidate>
                    <div class="field">
                        <label for="nombreInput" class="field-label">Nombre</label>
                        <input
                            type="text"
                            id="nombreInput"
                            class="field-input"
                            placeholder="Ej. Carolina Gómez"
                            autocomplete="off"
                        >
                    </div>

                    <div class="field">
                        <label for="profesionInput" class="field-label">Profesión</label>
                        <input
                            type="text"
                            id="profesionInput"
                            class="field-input"
                            placeholder="Ej. Desarrolladora Web / Data Analyst"
                            autocomplete="off"
                        >
                    </div>

                    <div class="field">
                        <label for="fotoUrlInput" class="field-label">URL de la foto</label>
                        <input
                            type="url"
                            id="fotoUrlInput"
                            class="field-input"
                            placeholder="https://ejemplo.com/foto.jpg"
                            autocomplete="off"
                        >
                    </div>

                    <p id="estadoImagen" class="status-note" aria-live="polite"></p>
                </form>
            </section>

            <section class="panel preview-panel" aria-label="Vista previa de tarjeta de perfil">
                <span class="preview-tag">Vista previa</span>
                <article id="tarjetaPerfil" class="profile-card">
                    <div class="avatar-frame">
                        <img
                            id="fotoPerfil"
                            class="profile-avatar"
                            src=""
                            alt="Foto de perfil"
                        >
                    </div>
                    <h2 id="nombrePerfil" class="profile-name">Tu nombre</h2>
                    <p id="profesionPerfil" class="profile-role">Tu profesión</p>
                </article>
            </section>
        </main>
        <script src="./js/app.js"></script>
    </body>
</html>
