<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vista Previa de Texto</title>
        <link rel="stylesheet" href="./css/estilos.css">
    </head>
    <body>
        <div class="card">
            <h1>📝 Vista Previa en Vivo</h1>
            <textarea id="textoInput" placeholder="Escribe algo increíble aquí..."></textarea>
            <div class="preview-box">
                <span class="preview-label">Vista previa:</span>
                <p id="vistaPrevia" class="preview-text">Tu texto aparecerá aquí en tiempo real...</p>
            </div>
        </div>
        <script src="./js/app.js"></script>
    </body>
</html>
