<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora de IMC</title>
        <link rel="stylesheet" href="./css/estilos.css">
    </head>
    <body>
        <main class="wrapper">
            <section class="card">
                <h1 class="card-title">⚖️ Calculadora de IMC</h1>
                <p class="card-subtitle">Ingresa tu peso en kilogramos y tu estatura en metros.</p>

                <form id="formularioImc" class="imc-form" novalidate>
                    <div class="input-group">
                        <label for="pesoInput" class="input-label">Peso (kg)</label>
                        <input
                            type="number"
                            id="pesoInput"
                            class="imc-input"
                            placeholder="Ej. 70"
                            step="0.1"
                            min="1"
                        >
                    </div>

                    <div class="input-group">
                        <label for="estaturaInput" class="input-label">Estatura (m)</label>
                        <input
                            type="number"
                            id="estaturaInput"
                            class="imc-input"
                            placeholder="Ej. 1.75"
                            step="0.01"
                            min="0.1"
                        >
                    </div>

                    <button type="submit" id="calcularBtn" class="calc-btn">Calcular IMC</button>
                </form>

                <div id="resultadoBox" class="result-box" aria-live="polite">
                    <p id="mensajeResultado" class="result-placeholder">Aquí aparecerá tu IMC.</p>
                    <p id="categoriaResultado" class="result-category"></p>
                </div>
            </section>
        </main>
        <script src="./js/app.js"></script>
    </body>
</html>
