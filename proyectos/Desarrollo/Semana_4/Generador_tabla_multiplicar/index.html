<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Generador de Tabla de Multiplicar</title>
        <link rel="stylesheet" href="./css/estilos.css">
    </head>
    <body>
        <main class="wrapper">
            <section class="card">
                <h1 class="card-title">✖️ Tabla de Multiplicar</h1>
                <p class="card-subtitle">Ingresa un número para generar su tabla del 1 al 10.</p>

                <div class="form-group">
                    <label for="numeroInput" class="field-label">Número a multiplicar</label>
                    <div class="input-row">
                        <input
                            type="number"
                            id="numeroInput"
                            class="field-input"
                            placeholder="Ej. 5"
                            autocomplete="off"
                        >
                        <button type="button" id="generarBtn" class="action-btn">Generar tabla</button>
                    </div>
                </div>

                <p id="mensajeAviso" class="status-note" aria-live="polite"></p>

                <div id="contenedorResultado" class="table-container"></div>
            </section>
        </main>
        <script src="./js/app.js"></script>
    </body>
</html>
