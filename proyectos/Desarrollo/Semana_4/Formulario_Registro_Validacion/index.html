<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de Registro con Validación</title>
        <link rel="stylesheet" href="./css/estilos.css">
    </head>
    <body>
        <main class="wrapper">
            <section class="card">
                <h1 class="card-title">📝 Registro de Usuario</h1>
                <p class="card-subtitle">Completa todos los campos para enviar tu registro.</p>

                <form id="registroForm" class="reg-form" novalidate>
                    <div class="field">
                        <label for="nombreInput" class="field-label">Nombre</label>
                        <input
                            type="text"
                            id="nombreInput"
                            class="field-input"
                            placeholder="Ej. Carolina Gómez"
                            autocomplete="name"
                        >
                        <span id="errorNombre" class="field-error" aria-live="polite"></span>
                    </div>

                    <div class="field">
                        <label for="correoInput" class="field-label">Correo electrónico</label>
                        <input
                            type="email"
                            id="correoInput"
                            class="field-input"
                            placeholder="Ej. carolina@correo.com"
                            autocomplete="email"
                        >
                        <span id="errorCorreo" class="field-error" aria-live="polite"></span>
                    </div>

                    <div class="field">
                        <label for="edadInput" class="field-label">Edad</label>
                        <input
                            type="number"
                            id="edadInput"
                            class="field-input"
                            placeholder="Ej. 20"
                            min="0"
                        >
                        <span id="errorEdad" class="field-error" aria-live="polite"></span>
                    </div>

                    <button type="submit" id="registrarBtn" class="submit-btn">Registrarme</button>

                    <p id="mensajeExito" class="success-banner" aria-live="polite"></p>
                </form>
            </section>
        </main>
        <script src="./js/app.js"></script>
    </body>
</html>
